[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Neuroballad"
version = "0.1.0"
description = "Neural Circuit Simulation for Python"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Mehmet Kerem Turkcan", email = "mkt2126@columbia.edu" }]
dependencies = [
  "networkx",
  "numpy",
  "h5py",
  "matplotlib"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Neuroballad*", "neuroballad*"]
